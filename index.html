<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Launching Soon — Kimti Moti Welfare & Social Trust</title>
<style>
  :root{
    --brand: #621244;
    --text: #111;
    --muted: #666;
    --bg: #ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .wrapper{
    max-width:640px;
    width:100%;
    text-align:center;
    padding:40px 26px;
  }

  /* heading */
  h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    color:var(--brand);
    font-weight:800;
    margin-bottom:10px;
  }
  p.lead{
    font-size:1.03rem;
    color:var(--muted);
    margin-bottom:18px;
  }

  /* date badge */
  .date{
    display:inline-block;
    padding:10px 18px;
    border:2px solid var(--brand);
    border-radius:8px;
    font-weight:700;
    color:var(--brand);
    margin-bottom:18px;
  }

  /* typing line */
  .typing-wrap{
    margin-top:18px;
    height:36px; /* reserve height to avoid layout jump */
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--muted);
    font-weight:600;
    font-size:0.98rem;
  }
  .typed {
    color:var(--text);
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    display:inline-block;
    vertical-align:middle;
    min-width:16ch;
  }
  /* caret */
  .caret {
    width:2px;
    height:1.05em;
    background:var(--brand);
    display:inline-block;
    vertical-align:middle;
    animation: blink 1s steps(2,end) infinite;
    margin-left:6px;
    border-radius:1px;
  }
  @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

  footer{
    margin-top:30px;
    color:var(--muted);
    font-size:0.92rem;
  }

  /* small screens */
  @media (max-width:420px){
    .wrapper{ padding:28px 18px }
    .typed{ min-width:12ch }
    .date{ padding:8px 12px; }
  }
</style>
</head>
<body>
  <div class="wrapper" role="main" aria-labelledby="heading">
    <h1 id="heading">Launching Soon</h1>
    <p class="lead">We’re excited to unveil our new website — stay tuned.</p>

    <div class="date" aria-hidden="false">15 October 2025 — 10:00 AM IST</div>

    <div class="typing-wrap" aria-live="polite" aria-atomic="true">
      <div class="typed" id="typed" aria-hidden="false"></div>
      <span class="caret" aria-hidden="true"></span>
    </div>

    <footer>© 2025 Kimti Moti Welfare &amp; Social Trust</footer>
  </div>

<script>
/*
  Typing animation:
  - Edit `phrases` to change what's typed.
  - Typing speed and pause durations below are easy to tune.
*/
(function(){
  const typedEl = document.getElementById('typed');

  // Phrases to cycle through
  const phrases = [
    "writing code",
    "designing pages",
    "setting up resources",
    "testing features",
    "polishing content"
  ];

  // Timing (ms)
  const typeSpeed = 60;      // per character
  const eraseSpeed = 35;     // per character when erasing
  const holdAfter = 1000;    // hold after typing full phrase
  const holdBefore = 400;    // pause before typing next phrase

  let phraseIndex = 0;

  function typePhrase(phrase){
    return new Promise(resolve => {
      let i = 0;
      typedEl.textContent = "";
      const t = setInterval(() => {
        typedEl.textContent = phrase.slice(0, ++i);
        if (i >= phrase.length) {
          clearInterval(t);
          setTimeout(() => resolve(), holdAfter);
        }
      }, typeSpeed);
    });
  }

  function erasePhrase(){
    return new Promise(resolve => {
      let current = typedEl.textContent;
      let j = current.length;
      const t = setInterval(() => {
        typedEl.textContent = current.slice(0, --j);
        if (j <= 0) {
          clearInterval(t);
          setTimeout(() => resolve(), holdBefore);
        }
      }, eraseSpeed);
    });
  }

  async function loop(){
    while(true){
      const phrase = phrases[phraseIndex];
      await typePhrase(phrase);
      await erasePhrase();
      phraseIndex = (phraseIndex + 1) % phrases.length;
    }
  }

  // Start after small delay so page feels snappy
  setTimeout(loop, 600);

  // Accessibility: expose current phrase to screen readers via aria-live (container already has aria-live)
})();
</script>
</body>
</html>
