<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon</title>
  <style>
    :root {
      --main: #621244;
      --accent: #9d1c6d;
      --light: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(-45deg, var(--main), var(--accent), #431033, #2d0822);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      color: var(--light);
      overflow: hidden;
      text-align: center;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 10px 0;
      z-index: 2;
    }

    p {
      margin: 0 0 20px 0;
      font-size: 1.2rem;
      opacity: 0.9;
      z-index: 2;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
      z-index: 2;
    }

    /* Animated circles background */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      animation: floatUp 20s linear infinite;
    }

    .circle:nth-child(1) { width: 120px; height: 120px; left: 15%; bottom: -150px; animation-duration: 25s; }
    .circle:nth-child(2) { width: 200px; height: 200px; left: 70%; bottom: -200px; animation-duration: 30s; }
    .circle:nth-child(3) { width: 80px; height: 80px; left: 40%; bottom: -100px; animation-duration: 18s; }
    .circle:nth-child(4) { width: 150px; height: 150px; left: 85%; bottom: -180px; animation-duration: 22s; }
    .circle:nth-child(5) { width: 100px; height: 100px; left: 5%; bottom: -120px; animation-duration: 20s; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 0.4; }
      50% { opacity: 0.7; }
      100% { transform: translateY(-120vh) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <h1>🚀 Coming Soon</h1>
  <p>We’re almost ready. Stay tuned for something amazing!</p>

  <footer>© 2025 Kimti Moti Welfare & Social Trust</footer>
</body>
</html>
